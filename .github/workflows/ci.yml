name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine tests (Python)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt
      - run: pip install -r engine/requirements-dev.txt
      - run: brew install ffmpeg
      # LibreOffice is large and slow to install; its tests skip themselves when it's absent.
      - run: python -m pytest tests -m "not slow"
        working-directory: engine

  app:
    name: App tests (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: app
      - name: Run unit tests
        working-directory: app
        env:
          SKIP_ENGINE_EMBED: "1"
        run: |
          xcodebuild test -project Recast.xcodeproj -scheme Recast \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO
