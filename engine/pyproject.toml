[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recast-engine"
version = "1.0.0"
description = "Offline file conversion engine for the Recast Mac app"
requires-python = ">=3.11"
dependencies = [
    "Pillow==13.0.0",
    "pypdfium2==5.15.2",
    "pypdf==7.1.0",
    "packaging==26.3",
]

[project.optional-dependencies]
dev = ["pillow-heif==1.8.1", "pytest==9.2.0"]
test = ["pytest==9.2.0"]

[tool.setuptools]
packages = ["recast_engine", "recast_engine.converters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: long-running conversions (video); deselect with -m 'not slow'",
]
